<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>ShopLite</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="node_modules/@fontsource-variable/outfit/index.css"
    />
    <link
      rel="stylesheet"
      href="src/css/output.css"
    />
  </head>
  <body class="font-body bg-surface text-[21px] font-extralight text-ink">
    <site-svg></site-svg>
    <site-header></site-header>
    <section
      class="text-ink px-4 sm:px-8 lg:px-16 xl:px-48 py-28 w-full flex justify-between items-start gap-10"
    >
      <div class="w-4/5 flex flex-col justify-center items-center gap-5">
        <div class="w-full flex justify-between items-center">
          <div>
            <span>Showing</span>
            <span id="start"></span> <span>-</span> <span id="end"></span> of <span  id="total"></span>
            <span>results</span>
          </div>
          <div class="flex justify-center items-center gap-4">
            <span>Default sorting</span
            ><span>
              <svg class="search h-4 w-4 rotate-90">
                <use xlink:href="#alt-arrow-right-outline"></use></svg
            ></span>
          </div>
        </div>
        <div id="shopMainContainer" class="w-full flex items-start justify-between gap-4 flex-wrap"></div>
        <div id="pageNumber" class="flex justify-between items-center gap-5 py-10">
          <button id="prevPage" class="text-ink hover:text-primary transition duration-300 ease-in-out">Prev</button>
          <!-- <div id="" class="flex justify-evenly items-center"></div>    -->
          <button id="nextPage" class="text-ink hover:text-primary transition duration-300 ease-in-out">Next</button>
        </div>
      </div>
      <div class="w-1/5 flex flex-col justify-between items-center gap-15">
        <div
          class="w-full border border-line rounded-lg p-2 flex justify-between items-center"
        >
          <input
            type="text"
            class="w-3/5 outline-none border-none focus:placeholder-transparent ps-3"
            placeholder="Search"
          />
          <span
            class="w-1/4 flex justify-center items-center bg-primary rounded-md p-5"
          >
            <button
              type="button"
              id="searchBtnIcone"
            >
              <svg class="search h-3 w-3 text-surface">
                <use xlink:href="#search"></use>
              </svg>
            </button>
          </span>
        </div>
        <div class="w-full">
          <h3 class="uppercase text-ink mb-3">Categories</h3>
          <div
            class="flex-1 h-4 min-w-0"
            style="
              background: repeating-linear-gradient(
                110deg,
                transparent 0 5px,
                #e3e3e3 5px 7px,
                transparent 7px 12px
              );
            "
          ></div>
        </div>
        <div class="w-full">
          <ul>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >All</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Phones</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Accessories</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Tablets</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Watches</a
              >
            </li>
          </ul>
        </div>
        <div class="w-full">
          <h3 class="uppercase text-ink mb-3">Tags</h3>
          <div
            class="flex-1 h-4 min-w-0"
            style="
              background: repeating-linear-gradient(
                110deg,
                transparent 0 5px,
                #e3e3e3 5px 7px,
                transparent 7px 12px
              );
            "
          ></div>
        </div>
        <div class="w-full">
          <ul>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >White</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Cheap</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Mobile</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Modern</a
              >
            </li>
          </ul>
        </div>
        <div class="w-full">
          <h3 class="uppercase text-ink mb-3">Brands</h3>
          <div
            class="flex-1 h-4 min-w-0"
            style="
              background: repeating-linear-gradient(
                110deg,
                transparent 0 5px,
                #e3e3e3 5px 7px,
                transparent 7px 12px
              );
            "
          ></div>
        </div>
        <div class="w-full">
          <ul>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Apple</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Samsung</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Huwai</a
              >
            </li>
          </ul>
        </div>
        <div class="w-full">
          <h3 class="uppercase text-ink mb-3">Filter by pric</h3>
          <div
            class="flex-1 h-4 min-w-0"
            style="
              background: repeating-linear-gradient(
                110deg,
                transparent 0 5px,
                #e3e3e3 5px 7px,
                transparent 7px 12px
              );
            "
          ></div>
        </div>
        <div class="w-full">
          <ul>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >Less than $10</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >$10- $20</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >$20- $30</a
              >
            </li>
            <li>
              <a
                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"

                href="#"
                class="hover:text-primary transition duration-300 ease-in-out"
                >$40- $50</a
              >
            </li>
          </ul>
        </div>
      </div>
    </section>
    <site-footer></site-footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script src="src/js/components/svg.js"></script>
    <script src="src/js/components/header.js"></script>

    <script src="src/js/components/footer.js"></script>
    <script src="src/js/utils/swipper.js"></script>
    <script src="src/js/utils/shopMakeCard.js"></script>
    <script src="src/js/main.js"></script>
